{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

    <style>
     @keyframes moveBackgroundVertical {
    from { background-position: 0 0; }
    to { background-position: 0 100%; }
}

body {
    /* Background image with vertical animation */
    background-color: #2d73fd;
    background: url("{% static 'images/background.PNG' %}") no-repeat center center fixed;
    background-attachment: fixed;
    background-size: cover;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    color: #fff;

    /* Vertical movement animation */
    animation: moveBackgroundVertical 40s linear infinite;
}

        .card {
            border-radius: 16px;
            border: none;
        }

        .btn-primary {
            background-color: #1E90FF;
            border-color: #1E90FF;
        }
        .btn-primary:hover {
            background-color: #0056b3;
            border-color: #0056b3;
        }

        a {
            color: #1E90FF;
            text-decoration: none;
        }
        a:hover {
            color: #0056b3;
        }

                  /* Footer styles */
        footer {
            background: rgba(0, 0, 0, 0.9);
            color: #ddd;
            padding: 2rem 0;
            margin-top: 3rem;
        }

        footer a {
            color: #4da6ff;
            text-decoration: none;
        }
        footer a:hover {
            color: #1E90FF;
        }

        .social-icons a {
            display: inline-block;
            margin: 0 10px;
            font-size: 1.4rem;
            color: #4da6ff;
            transition: color 0.3s;
        }
        .social-icons a:hover {
            color: #1E90FF;
        }

        .social-icons a .bi-whatsapp {
    color: #25D366; /* official WhatsApp green */
    font-size: 1.5rem;
    transition: color 0.3s;
}
.social-icons a .bi-whatsapp:hover {
    color: #128C7E;
}


/* Twitter */
.social-icons a .bi-twitter {
    color: #1DA1F2;
}
.social-icons a .bi-twitter:hover {
    color: #0d8ddb;
}

/* Instagram */
.social-icons a .bi-instagram {
    color: #E4405F; /* Instagram pink */
}
.social-icons a .bi-instagram:hover {
    color: #d62a52;
}

/* LinkedIn */
.social-icons a .bi-linkedin {
    color: #0077B5;
}
.social-icons a .bi-linkedin:hover {
    color: #005582;
}

        
    </style>
</head>
<body>

    <div class="container d-flex align-items-center justify-content-center vh-100">
        <div class="card shadow-lg p-4" style="max-width: 400px; width: 100%;">
            <h3 class="text-center mb-4">Login</h3>

            <form method="POST" novalidate>
                {% csrf_token %}
                <!-- Render Django form fields -->
                {{ form.as_p }}

                <button type="submit" class="btn btn-primary w-100 mt-3">Login</button>
            </form>

            <p class="text-center mt-3 mb-0">
                Don’t have an account? <a href="{% url 'register' %}">Register here</a>
            </p>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <div class="container text-center">
            <p class="mb-2">© 2025 WolBrand.Inn | All Rights Reserved</p>
            <p class="mb-2">
                <a href="{% url 'contactus' %}">Contact Us</a> |  
                <a href="{% url 'privacy_policy' %}">Privacy Policy</a> | 
                <a href="{% url 'terms_of_service' %}">Terms of service</a>  
                
            </p>
            <div class="social-icons">
                <a href="#"><i class="bi bi-facebook"></i></a>
                  <a href="https://wa.me/+254113906162" target="_blank" title="Chat on WhatsApp">
        <i class="bi bi-whatsapp"></i>
    </a>
                    <a href="#" title="Twitter">
        <i class="bi bi-twitter"></i>
    </a>
    <a href="#" title="Instagram">
        <i class="bi bi-instagram"></i>
    </a>
    <a href="#" title="LinkedIn">
        <i class="bi bi-linkedin"></i>
    </a>
</div>
            </div>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
